services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://private_ai_stack:private_ai_stack@postgres:5432/private_ai_stack
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./audit:/app/audit
      - ./reports:/app/reports
      - ./exports:/app/exports
      - ./sample-target:/app/sample-target:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - private-ai-stack
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.31.1
    volumes:
      - ollama-models:/root/.ollama
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - private-ai-stack
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: private_ai_stack
      POSTGRES_USER: private_ai_stack
      POSTGRES_PASSWORD: private_ai_stack
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - private-ai-stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U private_ai_stack -d private_ai_stack"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - private-ai-stack
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - private-ai-stack
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  private-ai-stack:
    name: private-ai-stack

volumes:
  ollama-models:
  postgres-data:
