[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "privateaistack"
version = "0.1.0a3"
description = "Local-first AI agents, persistent RAG, governed code review, auditability, and optional observability."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "sekacorn" }]
maintainers = [{ name = "sekacorn" }]
keywords = ["ai", "agents", "ollama", "rag", "audit", "devsecops", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "agentforge-oss>=0.5.1,<0.6.0",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/sekacorn/PrivateAIStack"
Repository = "https://github.com/sekacorn/PrivateAIStack"
Issues = "https://github.com/sekacorn/PrivateAIStack/issues"
Changelog = "https://github.com/sekacorn/PrivateAIStack/blob/master/CHANGELOG.md"
Documentation = "https://github.com/sekacorn/PrivateAIStack/tree/master/docs"

[project.optional-dependencies]
postgres = [
  "agentforge-oss[pgvector]>=0.5.1,<0.6.0",
  "psycopg[binary]>=3.2",
]
observability = [
  "agentforge-oss[otel]>=0.5.1,<0.6.0",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp-proto-grpc>=1.26",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests>=2.32",
  "twine>=5.1",
]
security = [
  "bandit>=1.7",
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
]
quality = [
  "radon>=6.0",
  "yamllint>=1.35",
]
all = [
  "agentforge-oss[pgvector,otel]>=0.5.1,<0.6.0",
  "psycopg[binary]>=3.2",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp-proto-grpc>=1.26",
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests>=2.32",
  "twine>=5.1",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
  "radon>=6.0",
  "yamllint>=1.35",
]

[project.scripts]
privateaistack = "private_ai_stack.cli.main:main"

[tool.hatch.build]
exclude = [
  ".env",
  ".env.*",
  ".audit-venv/**",
  ".audit-dev-venv/**",
  ".mypy_cache/**",
  ".venv-release/**",
  ".package-sdist-venv/**",
  ".package-test-venv/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  "audit/*.jsonl",
  "backups/**",
  "build/**",
  "coverage.xml",
  ".coverage",
  "data/**",
  "dist/**",
  "exports/**",
  "htmlcov/**",
  "logs/**",
  "package-test-deployment/**",
  "reports/**",
  "sample-target/**",
  "tmp/**",
  "venv/**",
]

[tool.hatch.build.force-include]
"private_ai_stack/templates/deployment/.env.example" = "private_ai_stack/templates/deployment/.env.example"

[tool.hatch.build.targets.wheel]
packages = ["private_ai_stack"]

[tool.hatch.build.targets.sdist]
include = [
  ".dockerignore",
  ".github/**",
  "ARCHITECTURE.md",
  "CHANGELOG.md",
  "CODEOWNERS",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "Dockerfile",
  "LICENSE",
  "Makefile",
  "NOTICE.md",
  "README.md",
  "SECURITY.md",
  "THREAT_MODEL.md",
  "compose.yaml",
  "config/**",
  "docker/**",
  "docs/**",
  "examples/**",
  "private_ai_stack/**",
  "pyproject.toml",
  "scripts/**",
  "tests/**",
]
exclude = [
  ".env",
  ".env.*",
  ".audit-venv/**",
  ".audit-dev-venv/**",
  ".mypy_cache/**",
  ".venv-release/**",
  ".package-sdist-venv/**",
  ".package-test-venv/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  "audit/*.jsonl",
  "backups/**",
  "build/**",
  "data/**",
  "dist/**",
  "exports/**",
  "htmlcov/**",
  "logs/**",
  "package-test-deployment/**",
  "sample-target/**",
  "tmp/**",
  "venv/**",
]

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = ["sample-target", ".venv", ".package-test-venv", "package-test-deployment", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests/fixtures", "sample-target"]

[tool.pytest.ini_options]
addopts = "--cov=private_ai_stack --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["private_ai_stack"]

[tool.coverage.report]
show_missing = true
fail_under = 80
