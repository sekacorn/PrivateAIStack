name: Release

on:
  push:
    tags:
      # Only version tags start a release. A bare "v" prefix would also match
      # names like "vendor-audit", which would start a run that can only fail
      # the tag/version check.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to run against (for example v0.2.0b5)"
        required: true
        type: string
      dry_run:
        description: "Run every check but skip the PyPI upload"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Report the release mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "event_name     = ${EVENT}"
          echo "inputs.dry_run = '${DRY_RUN}'"
          if [ "${EVENT}" != "push" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "mode           = DRY RUN (the PyPI upload and everything after it will be skipped)"
          else
            echo "mode           = REAL RELEASE (the PyPI upload will run)"
          fi

      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,observability,security]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (ruff)
        run: python -m ruff format --check .

      - name: Type check (mypy)
        run: python -m mypy private_ai_stack

      - name: Security lint (bandit)
        run: python -m bandit -r private_ai_stack

      - name: Tests
        run: python -m pytest --cov=private_ai_stack --cov-branch

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              print(f"Tag {tag!r} does not match package version {version!r}; expected {expected!r}.", file=sys.stderr)
              raise SystemExit(1)
          print(f"Release tag {tag} matches package version {version}.")
          PY

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Skipped on a dry run. `inputs.dry_run` is empty on a push event,
    # so the event check comes first: a push is always a real release.
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Refuse to upload during a dry run
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${EVENT}" != "push" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "This job must not run during a dry run. Failing instead of uploading."
            exit 1
          fi
          echo "Confirmed a real release: event=${EVENT} dry_run='${DRY_RUN}'"

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
