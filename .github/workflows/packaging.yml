name: Packaging

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,security,quality,postgres,observability]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy private_ai_stack
      - run: python -m pytest --cov=private_ai_stack --cov-branch --cov-report=term-missing
      - run: python -m bandit -r private_ai_stack
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/privateaistack-0.1.0a2-py3-none-any.whl
      - run: privateaistack --version
      - run: privateaistack init package-test-deployment
      - run: privateaistack config check --directory package-test-deployment
      - run: docker compose -f package-test-deployment/compose.yaml config
      - run: sha256sum dist/* > checksums.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: privateaistack-0.1.0a2
          path: |
            dist/*
            checksums.txt
