name: Packaging

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,security,quality,postgres,observability]"
      - run: python -m ruff check .
      - run: python -m mypy private_ai_stack
      - run: python -m pytest
      - run: python -m bandit -r private_ai_stack
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/privateaistack-0.1.0a1-py3-none-any.whl
      - run: privateaistack --version
      - run: privateaistack init package-test-deployment
      - run: privateaistack config check --directory package-test-deployment
      - run: docker compose -f package-test-deployment/compose.yaml config
      - run: sha256sum dist/* > checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privateaistack-0.1.0a1
          path: |
            dist/*
            checksums.txt
