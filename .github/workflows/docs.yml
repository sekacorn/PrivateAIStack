name: Documentation

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test -f README.md
      - run: grep -R "qwen2.5:3b" README.md .env.example docs
