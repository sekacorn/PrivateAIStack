name: Documentation

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - run: test -f README.md
      - run: grep -R "qwen2.5:3b" README.md .env.example docs
