name: Publish to PyPI

# Trusted publishing: no API tokens. PyPI verifies the OIDC claims below
# (repository, workflow filename, environment) against the publisher you
# registered at https://pypi.org/manage/project/privateaistack/settings/publishing/
#
# Publishing is gated on a published GitHub Release so it never fires on a
# normal push or PR. To release: create a release for tag v0.1.0-alpha.1.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Must match the "Environment name" of your PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/privateaistack
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
