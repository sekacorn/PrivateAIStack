name: Publish to PyPI

# Trusted publishing: no API tokens. PyPI verifies the OIDC claims below
# (repository, workflow filename, environment) against the publisher you
# registered at https://pypi.org/manage/project/privateaistack/settings/publishing/
#
# Publishing is gated on a published GitHub Release so it never fires on a
# normal push or PR. To release: create a release for tag v0.1.0-alpha.1.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Must match the "Environment name" of your PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/privateaistack
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: dist/
      # NOTE: This is a Docker action; it pulls ghcr.io/pypa/gh-action-pypi-publish:<ref>.
      # No image is tagged by commit SHA, so it must be pinned to a version tag, not a SHA.
      - uses: pypa/gh-action-pypi-publish@v1.14.0
