name: Container

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - run: docker compose config
      - run: docker build .
