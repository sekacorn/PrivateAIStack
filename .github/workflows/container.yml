name: Container

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config
      - run: docker build .
