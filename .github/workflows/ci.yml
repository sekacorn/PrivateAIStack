name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # postgres + observability provide psycopg / opentelemetry so mypy can resolve their imports.
      - run: python -m pip install -e ".[dev,postgres,observability]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy private_ai_stack
      - run: python -m pytest --cov=private_ai_stack --cov-branch --cov-report=term-missing

  # The reimplemented AgentForge embedder must match the *latest* release in the
  # supported range, not only whichever version a lockstep resolve happens to
  # pick. pip picks the latest in range by definition, so the job resolves it,
  # hands the version to the tests, and runs the conformance checks against it.
  embedder-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Upgrade agentforge-oss to the latest release in the declared range
        run: |
          constraint=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              document = tomllib.load(handle)
          matches = [r for r in document['project']['dependencies'] if r.startswith('agentforge-oss') and '[' not in r]
          assert len(matches) == 1, matches
          print(matches[0])
          ")
          echo "Declared range: $constraint"
          python -m pip install --upgrade "$constraint"
          resolved=$(python -c "import importlib.metadata as m; print(m.version('agentforge-oss'))")
          echo "Resolved latest in range: $resolved"
          echo "PRIVATEAISTACK_AGENTFORGE_EXPECTED=$resolved" >> "$GITHUB_ENV"
      - name: Conformance and golden vectors against that release
        run: |
          python -m pytest -v \
            tests/unit/test_reembed_agentforge_range.py \
            tests/unit/test_reembed_embedders.py \
            tests/unit/test_reembed_golden_vectors.py
