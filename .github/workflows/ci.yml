name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # postgres + observability provide psycopg / opentelemetry so mypy can resolve their imports.
      - run: python -m pip install -e ".[dev,postgres,observability]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy private_ai_stack
      - run: python -m pytest --cov=private_ai_stack --cov-branch --cov-report=term-missing
