name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # postgres + observability provide psycopg / opentelemetry so mypy can resolve their imports.
      - run: python -m pip install -e ".[dev,postgres,observability]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy private_ai_stack
      - run: python -m pytest --cov=private_ai_stack --cov-branch --cov-report=term-missing
