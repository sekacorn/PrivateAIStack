name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # postgres + observability provide psycopg / opentelemetry so mypy can resolve their imports.
      - run: python -m pip install -e ".[dev,postgres,observability]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy private_ai_stack
      - run: python -m pytest --cov=private_ai_stack --cov-branch --cov-report=term-missing

  # PrivateAIStack and the AI Infrastructure Suite take no code dependency on
  # each other; the contract between them is the re-embed-record.v1 document.
  # Nothing else checks that contract, which is how this package came to emit
  # twenty-one egress fields against a reader that knew ten, with every record
  # it produced rejected and no test noticing.
  #
  # This job installs the suite from its main branch and validates every record
  # variant this package emits through both the suite's reader and its shipped
  # JSON Schema. It fails on any field the installed suite does not know, in
  # either direction, so a divergence surfaces here rather than in an
  # operator's evidence.
  suite-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" jsonschema
      - name: Install the suite from its main branch
        # Not a declared dependency of this package: a runtime dependency on
        # the suite would invert the layering. It is installed for this job
        # only, and the contract tests skip when it is absent so the offline
        # matrix stays offline.
        run: |
          python -m pip install "git+https://github.com/sekacorn/AI-Infrastructure-Suite.git@main"
          python -c "import ai_infrastructure_suite as s; print('suite', s.__version__)"
      - name: Validate every emitted record against the suite
        # --no-cov: this job runs one directory, so the project's 80% coverage
        # gate does not apply to it. Coverage is enforced by the `test` matrix.
        run: python -m pytest -v --no-cov tests/contract

  # The reimplemented AgentForge embedder must match the *latest* release in the
  # supported range, not only whichever version a lockstep resolve happens to
  # pick. pip picks the latest in range by definition, so the job resolves it,
  # hands the version to the tests, and runs the conformance checks against it.
  embedder-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Upgrade agentforge-oss to the latest release in the declared range
        run: |
          constraint=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              document = tomllib.load(handle)
          matches = [r for r in document['project']['dependencies'] if r.startswith('agentforge-oss') and '[' not in r]
          assert len(matches) == 1, matches
          print(matches[0])
          ")
          echo "Declared range: $constraint"
          python -m pip install --upgrade "$constraint"
          resolved=$(python -c "import importlib.metadata as m; print(m.version('agentforge-oss'))")
          echo "Resolved latest in range: $resolved"
          echo "PRIVATEAISTACK_AGENTFORGE_EXPECTED=$resolved" >> "$GITHUB_ENV"
      - name: Conformance and golden vectors against that release
        # --no-cov: this job runs a subset, so the project's 80% coverage gate
        # does not apply to it. Coverage is enforced by the `test` matrix over
        # the whole suite.
        run: |
          python -m pytest -v --no-cov \
            tests/unit/test_reembed_agentforge_range.py \
            tests/unit/test_reembed_embedders.py \
            tests/unit/test_reembed_golden_vectors.py
